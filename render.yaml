services:
  - type: web
    name: interview-coach-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_QUESTIONS
        value: "6"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
